<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tab Shelf</title>
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="shelf.css">
</head>
<body>
  <div class="top"><div class="top-inner">
    <div class="brand">
      <img src="icons/48.png" alt="">
      <div><h1>Tab Shelf</h1><div class="stats" id="stats"></div></div>
    </div>
    <input id="search" type="search" placeholder="Search all saved tabs  ( / )">
    <button id="expandAll" class="ghost">Expand</button>
    <button id="collapseAll" class="ghost">Collapse</button>
    <button id="export">Export</button>
    <button id="import">Import</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </div></div>
  <main id="list"></main>
  <div id="toast"><span id="toastMsg"></span><button id="undo">Undo</button></div>
  <script src="store.js"></script>
  <script src="shelf.js"></script>
</body>
</html>
