<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shelf.css">
<style>
  body { width: 280px; padding: 14px; margin: 0; }
  h1 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  input { width: 100%; box-sizing: border-box; margin-bottom: 10px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .stack button { width: 100%; text-align: left; }
  #msg { min-height: 18px; font-size: 13px; color: var(--mut); margin-top: 10px; }
  #count { font-size: 12px; color: var(--mut); margin: -4px 0 10px; }
</style>
</head>
<body>
  <h1><img src="icons/32.png" alt="">Tab Shelf</h1>
  <div id="count"></div>
  <input id="name" type="text" placeholder="Name this window (optional)">
  <div class="stack">
    <button class="primary" data-mode="window-close">Save window &amp; close its tabs</button>
    <button data-mode="window-keep">Save window, keep tabs open</button>
    <button data-mode="tab-close">Save this tab &amp; close it</button>
    <button id="open" class="ghost">Open my shelf</button>
  </div>
  <div id="msg"></div>
  <script src="store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
